function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = true
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/pubmed"
setting = "transductive"
add_self_loops = true
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 256
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "bgrl"
max_steps = 2500
patience = 1
epoch_size = 2500

[base_config.pretrain.params]
p_drop_edge_first = 0.0
p_drop_edge_second = 0.0
p_mask_feat_first = 0.4
p_mask_feat_second = 0.4
ema_decay = 0.99

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0003
weight_decay = 0.0

[base_config.analysis]
targets = [
    "features",
    "edges",
]
