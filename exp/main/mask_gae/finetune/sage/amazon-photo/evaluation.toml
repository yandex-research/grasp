function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-photo"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 128
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.5
n_walks_per_anchor = 2
walk_len = 3
coef_degree = 0.0036189623488608654

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0003742619600659406
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0016036262228402254
weight_decay = 0.0
