function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/pubmed"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 448
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.5
n_walks_per_anchor = 4
walk_len = 7
coef_degree = 0.0012022841665365086

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.002104811074435826
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.00033712504281822056
weight_decay = 0.0
