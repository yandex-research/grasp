function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/city-roads-M"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 320
dropout = 0.0
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.4
n_walks_per_anchor = 2
walk_len = 2
coef_degree = 0.020825359223499023

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.000126878715277202
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.00012274489388917578
weight_decay = 0.0
