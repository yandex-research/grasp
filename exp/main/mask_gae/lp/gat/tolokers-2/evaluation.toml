function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/tolokers-2"
setting = "transductive"
add_self_loops = true
num_policy = "noisy-quantile-normal"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 256
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.8
n_walks_per_anchor = 4
walk_len = 3
coef_degree = 0.04922096038863764

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0012077397095396115
weight_decay = 0.0
