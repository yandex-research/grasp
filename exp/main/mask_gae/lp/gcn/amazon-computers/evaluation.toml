function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-computers"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 1
d_hidden = 192
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.6000000000000001
n_walks_per_anchor = 3
walk_len = 6
coef_degree = 0.004058944191363639

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0009833469172244478
weight_decay = 0.0
