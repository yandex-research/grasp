function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 128
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.8
n_walks_per_anchor = 4
walk_len = 5
coef_degree = 0.0003063971298565512

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00475622814416246
weight_decay = 0.0
