function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/cora"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 448
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "mask_gae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_anchor = 0.4
n_walks_per_anchor = 4
walk_len = 4
coef_degree = 0.00044156959519868596

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0001719968108144743
weight_decay = 0.0
