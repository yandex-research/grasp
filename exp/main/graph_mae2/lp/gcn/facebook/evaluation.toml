function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/facebook"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 512
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "graph_mae2"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.7
p_remask = 0.5
n_remask = 2
scaling_factor = 5.0
coef_latent = 0.6649022996593816
ema_decay = 0.9897853985149643

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0002177313440000649
weight_decay = 0.0
