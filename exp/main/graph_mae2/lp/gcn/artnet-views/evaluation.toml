function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/artnet-views"
setting = "transductive"
add_self_loops = false
num_policy = "none"
ratio_policy = "noisy-quantile-normal"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 448
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "graph_mae2"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.7
p_remask = 0.0
n_remask = 4
scaling_factor = 2.0
coef_latent = 4.013111305305211
ema_decay = 0.9982193333576449

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.000328025032538597
weight_decay = 0.0
