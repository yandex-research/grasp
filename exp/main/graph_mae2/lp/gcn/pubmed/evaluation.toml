function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/pubmed"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 1
d_hidden = 512
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "graph_mae2"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.8
p_remask = 0.5
n_remask = 2
scaling_factor = 2.0
coef_latent = 0.03127133049079254
ema_decay = 0.9835992116021998

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00010512082238235949
weight_decay = 0.0
