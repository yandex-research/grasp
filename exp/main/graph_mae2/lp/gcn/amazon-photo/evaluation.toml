function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-photo"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 192
dropout = 0.4
activation = "relu"

[base_config.pretrain]
method = "graph_mae2"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.8500000000000001
p_remask = 0.5
n_remask = 3
scaling_factor = 3.0
coef_latent = 0.01471752328952427
ema_decay = 0.9837870290843704

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00016988492288591924
weight_decay = 0.0
