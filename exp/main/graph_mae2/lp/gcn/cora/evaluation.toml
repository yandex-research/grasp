function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/cora"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 320
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "graph_mae2"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.75
p_remask = 0.5
n_remask = 1
scaling_factor = 6.0
coef_latent = 0.015972793069250948
ema_decay = 0.9954293163862243

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00021555382541062738
weight_decay = 0.0
