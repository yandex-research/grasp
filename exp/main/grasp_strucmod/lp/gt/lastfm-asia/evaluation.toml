function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/lastfm-asia"
setting = "transductive"
add_self_loops = true
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 192
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "grasp_naive"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
coef_degree = 0.00929322397241669
coef_feat = 0.9406641307372844

[base_config.pretrain.params.edge_config]
sampler = "edge"

[base_config.pretrain.params.edge_config.sampler_params]
p = 0.6000000000000001

[base_config.pretrain.params.feat_config]
type = "graph_mae"

[base_config.pretrain.params.feat_config.params]
p_mask_feat = 0.55
p_replace = 0.5
scaling_factor = 2.5

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00046306455549021536
weight_decay = 0.0
