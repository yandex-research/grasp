function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/city-roads-M"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 1
d_hidden = 320
dropout = 0.0
activation = "relu"

[base_config.pretrain]
method = "graph_mae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.75
p_replace = 0.65
scaling_factor = 3.0

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.001102666271452302
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.00011895901977356676
weight_decay = 0.0
