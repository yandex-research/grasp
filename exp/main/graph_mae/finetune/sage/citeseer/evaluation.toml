function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 128
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "graph_mae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.9
p_replace = 0.30000000000000004
scaling_factor = 2.5

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00021821547363845995
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0019387659858351046
weight_decay = 0.0
