seed = 0
function = "bin.gnn.main"
n_trials = 100
sampler_type = "TPESampler"

[sampler]
n_startup_trials = 20

[space]
seed = 0
synthetic_data = false
amp_dtype = "float16"

[space.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = true
num_policy = [
    "_tune_",
    "categorical",
    [
        "standard",
        "none",
    ],
]
external_split = true

[space.model]
inp_out_type = "linear"

[space.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = [
    "_tune_",
    "int",
    1,
    5,
]
d_hidden = [
    "_tune_",
    "int",
    64,
    512,
    64,
]
dropout = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.5,
    0.1,
]
activation = "relu"

[space.pretrain]
method = "graph_mae"
max_steps = 25000
patience = 100
epoch_size = 100

[space.pretrain.params]
p_mask_feat = [
    "_tune_",
    "discrete_uniform",
    0.5,
    0.9,
    0.05,
]
p_replace = [
    "_tune_",
    "discrete_uniform",
    0.0,
    1.0,
    0.05,
]
scaling_factor = [
    "_tune_",
    "discrete_uniform",
    1.0,
    4.0,
    0.5,
]

[space.pretrain.optimizer]
type = "AdamW"
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.02,
]
weight_decay = 0.0
