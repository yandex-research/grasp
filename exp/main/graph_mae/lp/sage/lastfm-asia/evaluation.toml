function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/lastfm-asia"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 128
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "graph_mae"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_mask_feat = 0.75
p_replace = 0.2
scaling_factor = 4.0

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00048458140988852003
weight_decay = 0.0
