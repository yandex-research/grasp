function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/artnet-exp"
setting = "transductive"
add_self_loops = true
num_policy = "noisy-quantile-normal"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 384
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "bgrl"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.0
p_drop_edge_second = 0.7000000000000001
p_mask_feat_first = 0.6000000000000001
p_mask_feat_second = 0.4
ema_decay = 0.9927741640393493

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0001899775375855623
weight_decay = 0.0
