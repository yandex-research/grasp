function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/tolokers-2"
setting = "transductive"
add_self_loops = false
num_policy = "noisy-quantile-normal"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 192
dropout = 0.0
activation = "relu"

[base_config.pretrain]
method = "bgrl"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.5
p_drop_edge_second = 0.6000000000000001
p_mask_feat_first = 0.5
p_mask_feat_second = 0.4
ema_decay = 0.9898671817635747

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0003722345757423981
weight_decay = 0.0
