function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/artnet-views"
setting = "transductive"
add_self_loops = false
num_policy = "none"
ratio_policy = "noisy-quantile-normal"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 384
dropout = 0.0
activation = "relu"

[base_config.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.6000000000000001
p_drop_edge_second = 0.6000000000000001
p_mask_feat_first = 0.6000000000000001
p_mask_feat_second = 0.7000000000000001
temperature = 0.6447974920285381
batch_size = 2048

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00027991208858873173
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.00029319025720064254
weight_decay = 0.0
