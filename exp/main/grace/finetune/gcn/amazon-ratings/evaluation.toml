function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-ratings"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 384
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.30000000000000004
p_drop_edge_second = 0.2
p_mask_feat_first = 0.0
p_mask_feat_second = 0.30000000000000004
temperature = 0.030747455469005685
batch_size = 2048

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00023824446754069947
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0037087137156073657
weight_decay = 0.0
