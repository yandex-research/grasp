function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-ratings"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 320
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.6000000000000001
p_drop_edge_second = 0.4
p_mask_feat_first = 0.2
p_mask_feat_second = 0.30000000000000004
temperature = 0.17121335437138643
batch_size = 2048

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0007529455358858874
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.00011927443853807834
weight_decay = 0.0
