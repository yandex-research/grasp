seed = 0
function = "bin.gnn.main"
n_trials = 100
sampler_type = "TPESampler"

[sampler]
n_startup_trials = 20

[space]
seed = 0
synthetic_data = false
amp_dtype = "float16"

[space.data]
cache = false
path = "data/city-roads-M"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[space.model]
inp_out_type = "linear"

[space.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = [
    "_tune_",
    "int",
    1,
    5,
]
d_hidden = [
    "_tune_",
    "int",
    64,
    512,
    64,
]
dropout = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.5,
    0.1,
]
activation = "relu"

[space.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[space.pretrain.params]
p_drop_edge_first = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.8,
    0.1,
]
p_drop_edge_second = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.8,
    0.1,
]
p_mask_feat_first = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.8,
    0.1,
]
p_mask_feat_second = [
    "_tune_",
    "discrete_uniform",
    0.0,
    0.8,
    0.1,
]
temperature = [
    "_tune_",
    "loguniform",
    0.01,
    1.0,
]
batch_size = 2048

[space.pretrain.optimizer]
type = "AdamW"
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.02,
]
weight_decay = 0.0

[space.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[space.finetune.optimizer]
type = "AdamW"
lr = [
    "_tune_",
    "loguniform",
    0.0001,
    0.02,
]
weight_decay = 0.0
