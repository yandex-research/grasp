function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-ratings"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 448
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.6000000000000001
p_drop_edge_second = 0.0
p_mask_feat_first = 0.30000000000000004
p_mask_feat_second = 0.5
temperature = 0.08080041273426745
batch_size = 2048

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0045054276258689645
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.003810823661808764
weight_decay = 0.0
