function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/lastfm-asia"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 320
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "grace"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.4
p_drop_edge_second = 0.5
p_mask_feat_first = 0.7000000000000001
p_mask_feat_second = 0.1
temperature = 0.0916494688442455
batch_size = 2048

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0008634892375833494
weight_decay = 0.0
