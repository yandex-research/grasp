function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/artnet-views"
setting = "transductive"
add_self_loops = true
num_policy = "none"
ratio_policy = "noisy-quantile-normal"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 512
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "grasp_naive"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
coef_degree = 0.005576963602459099
coef_feat = 0.4837390721205032

[base_config.pretrain.params.edge_config]
sampler = "path"

[base_config.pretrain.params.edge_config.sampler_params]
p_anchor = 0.30000000000000004
n_walks_per_anchor = 3
walk_len = 5

[base_config.pretrain.params.feat_config]
type = "graph_mae"

[base_config.pretrain.params.feat_config.params]
p_mask_feat = 0.65
p_replace = 0.15000000000000002
scaling_factor = 3.5

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.000218151533742667
weight_decay = 0.0
