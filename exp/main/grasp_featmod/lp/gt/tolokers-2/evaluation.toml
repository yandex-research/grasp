function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/tolokers-2"
setting = "transductive"
add_self_loops = true
num_policy = "noisy-quantile-normal"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 192
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "grasp_naive"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
coef_degree = 0.004431760926789569
coef_feat = 3.823264464536562

[base_config.pretrain.params.edge_config]
sampler = "path"

[base_config.pretrain.params.edge_config.sampler_params]
p_anchor = 0.8
n_walks_per_anchor = 2
walk_len = 5

[base_config.pretrain.params.feat_config]
type = "grasp"

[base_config.pretrain.params.feat_config.params]
p_corrupt_feat = 0.6000000000000001

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0002751226658568803
weight_decay = 0.0
