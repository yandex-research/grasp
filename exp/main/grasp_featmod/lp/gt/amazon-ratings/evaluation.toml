function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-ratings"
setting = "transductive"
add_self_loops = true
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 1
d_hidden = 512
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "grasp_naive"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
coef_degree = 1.5975954213531007e-05
coef_feat = 0.31824153847560194

[base_config.pretrain.params.edge_config]
sampler = "path"

[base_config.pretrain.params.edge_config.sampler_params]
p_anchor = 0.8
n_walks_per_anchor = 4
walk_len = 4

[base_config.pretrain.params.feat_config]
type = "grasp"

[base_config.pretrain.params.feat_config.params]
p_corrupt_feat = 0.30000000000000004

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0034026693958163668
weight_decay = 0.0
