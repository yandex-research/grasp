function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/city-roads-M"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 512
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "epagcl"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.30000000000000004
p_drop_edge_second = 0.6000000000000001
p_add_edge_second = 0.0
p_mask_feat_first = 0.2
p_mask_feat_second = 0.2
temperature = 0.011564363598836816
batch_size = 2048
p_drop_cutoff = 1.0
p_add_cutoff = 0.9

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00017008985654086187
weight_decay = 0.0
