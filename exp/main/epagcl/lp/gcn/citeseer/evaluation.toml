function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 192
dropout = 0.0
activation = "relu"

[base_config.pretrain]
method = "epagcl"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_drop_edge_first = 0.5
p_drop_edge_second = 0.30000000000000004
p_add_edge_second = 0.6000000000000001
p_mask_feat_first = 0.0
p_mask_feat_second = 0.8
temperature = 0.9469462604146175
batch_size = 2048
p_drop_cutoff = 1.0
p_add_cutoff = 0.9

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00014998810479443264
weight_decay = 0.0
