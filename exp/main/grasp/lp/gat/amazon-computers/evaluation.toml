function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-computers"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 384
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.30000000000000004
p_mask_edge = 0.8
coef_degree = 5.064522063263417e-05
coef_feat = 1.3467090310965206

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0011595768309743723
weight_decay = 0.0
