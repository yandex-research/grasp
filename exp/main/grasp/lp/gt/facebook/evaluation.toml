function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/facebook"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 320
dropout = 0.2
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.4
p_mask_edge = 0.4
coef_degree = 0.0076940077450251285
coef_feat = 0.3021551045205692

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0006025615587190923
weight_decay = 0.0
