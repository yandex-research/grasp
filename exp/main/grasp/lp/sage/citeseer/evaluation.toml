function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 192
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.6000000000000001
p_mask_edge = 0.4
coef_degree = 0.003940481712853516
coef_feat = 4.330612446330904

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0002884246847295989
weight_decay = 0.0
