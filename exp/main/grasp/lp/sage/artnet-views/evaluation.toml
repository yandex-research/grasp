function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/artnet-views"
setting = "transductive"
add_self_loops = false
num_policy = "none"
ratio_policy = "noisy-quantile-normal"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 512
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.30000000000000004
p_mask_edge = 0.5
coef_degree = 0.0020057298740440163
coef_feat = 3.7504880301804424

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00015518763412116486
weight_decay = 0.0
