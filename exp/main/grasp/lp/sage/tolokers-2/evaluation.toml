function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/tolokers-2"
setting = "transductive"
add_self_loops = false
num_policy = "noisy-quantile-normal"
ratio_policy = "none"
cat_policy = "one-hot"
internal_split_name = "RL"

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 448
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.4
p_mask_edge = 0.4
coef_degree = 0.00021698677104535063
coef_feat = 8.856729960059804

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0008615668125999698
weight_decay = 0.0
