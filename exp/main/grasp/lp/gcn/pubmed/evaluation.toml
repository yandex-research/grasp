function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/pubmed"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 256
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.2
p_mask_edge = 0.8
coef_degree = 0.00022407307514668416
coef_feat = 0.5138450362446109

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0015851526640546971
weight_decay = 0.0
