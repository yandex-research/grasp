function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-photo"
setting = "transductive"
add_self_loops = true
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gt-sep"
norm_name = "layer"
residual = true
n_layers = 2
d_hidden = 256
dropout = 0.1
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.30000000000000004
p_mask_edge = 0.8
coef_degree = 0.0011478333560819467
coef_feat = 1.3649164893003682

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0018207747832544878
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0006915242457757258
weight_decay = 0.0
