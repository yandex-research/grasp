function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/amazon-computers"
setting = "transductive"
add_self_loops = true
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gat-sep"
norm_name = "layer"
residual = true
n_layers = 3
d_hidden = 128
dropout = 0.4
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.4
p_mask_edge = 0.4
coef_degree = 6.716912084248361e-05
coef_feat = 0.7450686323179719

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00014400158466937077
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0004007150296914302
weight_decay = 0.0
