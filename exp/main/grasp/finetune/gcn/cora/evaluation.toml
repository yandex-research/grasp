function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/cora"
setting = "transductive"
add_self_loops = false
num_policy = "none"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "gcn-sep"
norm_name = "layer"
residual = true
n_layers = 4
d_hidden = 256
dropout = 0.30000000000000004
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.7
p_mask_edge = 0.7
coef_degree = 0.009210570977855737
coef_feat = 1.8304623416389456

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.00010891186281492353
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0003367578400967695
weight_decay = 0.0
