function = "bin.gnn.main"
n_seeds = 10

[base_config]
synthetic_data = false
amp_dtype = "float16"

[base_config.data]
cache = false
path = "data/citeseer"
setting = "transductive"
add_self_loops = false
num_policy = "standard"
external_split = true

[base_config.model]
inp_out_type = "linear"

[base_config.model.backbone]
type = "BaseGraphBackbone"
conv_name = "sage"
norm_name = "layer"
residual = true
n_layers = 5
d_hidden = 128
dropout = 0.5
activation = "relu"

[base_config.pretrain]
method = "grasp"
max_steps = 25000
patience = 100
epoch_size = 100

[base_config.pretrain.params]
p_corrupt_feat = 0.7
p_mask_edge = 0.8
coef_degree = 0.0009396010353687168
coef_feat = 3.615323681000493

[base_config.pretrain.optimizer]
type = "AdamW"
lr = 0.0002804730507140496
weight_decay = 0.0

[base_config.finetune]
max_steps = 2500
patience = 100
epoch_size = 10

[base_config.finetune.optimizer]
type = "AdamW"
lr = 0.0006676018195696862
weight_decay = 0.0
